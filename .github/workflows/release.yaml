name: Release

# A Mielia release (v* tag, e.g. v0.5.0): the Revare repository's release workflow builds the
# Linux, Windows and macOS packages (the same toolchain, with Mielia branding chosen from this repository) and
# attaches them to a release in this repository.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    uses: dj-lumiere/Revare/.github/workflows/release.yaml@master
