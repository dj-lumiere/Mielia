name: Release

# A Mielia release (mi-v* tag, e.g. mi-v0.1.0): the Revare repository's release workflow builds the
# Linux, Windows and macOS packages (the same toolchain, with Mielia branding chosen from the tag) and
# attaches them to a release in this repository.

on:
  push:
    tags:
      - 'mi-v*'

permissions:
  contents: write

jobs:
  release:
    uses: dj-lumiere/Revare/.github/workflows/release.yaml@master
